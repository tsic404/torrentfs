            curl \
            ca-certificates
          # torrentfs mounts with allow_other; fuse3 gates that on this line.
          touch /etc/fuse.conf
          grep -q '^user_allow_other$' /etc/fuse.conf || echo 'user_allow_other' >> /etc/fuse.conf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/libtorrent-sys-cache
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-prefetch-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml', 'libtorrent-sys/src/defines.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Build torrentfs and the selfseed example
        run: |
