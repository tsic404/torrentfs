name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Cargo Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
      fail-fast: false
    container: debian:sid-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          apt-get update
          # libtorrent 2.1.1 and the Boost headers are fetched and compiled by
          # the crate's build script: the build chain needs a C++17 compiler and
          # openssl, nothing else.
          apt-get install -y --no-install-recommends \
            g++ \
            libssl-dev \
            curl \
            ca-certificates

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/libtorrent-sys-cache
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml', 'libtorrent-sys/src/defines.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Run tests
        id: run_tests
        # A libtorrent-backed test can abort the test process instead of
        # failing cleanly (known `piece_picker` lifetime flake class), so the
        # raw outcome is recorded here and classified by the next step: this
        # step on its own never fails the job.
        continue-on-error: true
        run: cargo test --locked --workspace --no-fail-fast

      - name: Classify test outcome
        if: steps.run_tests.outcome == 'failure'
        run: |
          # One retry. A suite that fails and then passes is flaky, not broken;
          # a suite that fails twice is a real failure. The two outcomes get
          # distinct annotations so a flake is never read as a regression.
          if cargo test --locked --workspace --no-fail-fast; then
            echo "::warning title=Flaky test (FLAKY)::Cargo Test (${{ matrix.arch }}) failed on the first attempt and passed on retry. Treat as FLAKY, not as a real failure."
            {
              echo "### FLAKY — not a real failure"
              echo
              echo 'The first `cargo test --locked --workspace --no-fail-fast` run failed and the retry passed.'
              echo 'This is the known libtorrent `piece_picker` lifetime flake class, not a regression from this PR.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Real test failure::Cargo Test (${{ matrix.arch }}) failed twice in a row. Treat as a REAL failure."
            exit 1
          fi

      - name: Run seeder example tests
        run: cargo test --locked --example torrentfs-selfseed-env --example torrentfs-mffs-seeder

  entrypoint-test:
    name: Entrypoint Shell Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run entrypoint detection tests
        run: ./ci/tests/entrypoint_test.sh

      - name: Syntax-check FUSE e2e scripts (not run here, no /dev/fuse)
        run: |
          bash -n ./ci/tests/small_cache_read_e2e.sh
          bash -n ./ci/tests/small_cache_steady_state_e2e.sh
          bash -n ./ci/tests/slow_swarm_e2e.sh
          bash -n ./tests/acceptance/lib_fuse_harness.sh
          bash -n ./tests/acceptance/lib_seed_torrent.sh
          bash -n ./tests/acceptance/tc_ingest_01.sh
          bash -n ./tests/acceptance/tc_ingest_03.sh
          bash -n ./tests/acceptance/tc_ingest_06.sh
          bash -n ./tests/acceptance/tc_rofs_01.sh
          bash -n ./tests/acceptance/tc_read_04.sh
          bash -n ./tests/acceptance/tc_stats_01.sh
          bash -n ./tests/acceptance/tc_stats_02.sh
          bash -n ./tests/acceptance/tc_recovery_01.sh
          bash -n ./tests/acceptance/tc_cache_02.sh
          bash -n ./tests/acceptance/tc_container_01.sh
          bash -n ./tests/acceptance/tc_container_02.sh
          bash -n ./tests/acceptance/tc_container_03.sh
          bash -n ./tests/acceptance/tc_container_04.sh
          bash -n ./tests/acceptance/tc_container_05.sh
          bash -n ./tests/acceptance/tc_container_06.sh
          bash -n ./tests/acceptance/tc_container_07.sh
          bash -n ./tests/acceptance/tc_container_08.sh

  deploy-rootful-test:
    name: Deploy Rootful Shell Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run deploy_rootful tests
        run: ./ci/tests/deploy_rootful_test.sh

  self-seed-env-test:
    name: Self-Seed Env Shell Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run self-seed env validation tests
        run: ./ci/tests/self_seed_env_test.sh

  docker-build-amd64:
    name: Docker Build (amd64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # The container cases poll a live daemon; this bounds a wedged run that
    # would otherwise hang until the workflow's default timeout.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: torrentfs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: docker run --rm torrentfs:ci --help

      - name: Verify static C++ runtime linkage
        # ADR-002's dynamic-dependency invariant: the binary must not depend on
        # libstdc++ / libgcc_s at runtime.
        # libtorrent-sys declares the static stdc++/gcc_eh native libs through
        # its `links` metadata; assert the actual DT_NEEDED so a regression
        # fails CI instead of only a manual readelf check.
        run: |
          docker create --name torrentfs-check torrentfs:ci
          docker cp torrentfs-check:/usr/local/bin/torrentfs ./torrentfs-check
          docker rm torrentfs-check
          if readelf -d ./torrentfs-check | grep -E 'libstdc\+\+\.so\.6|libgcc_s\.so\.1'; then
            echo "::error title=Static runtime linkage regressed::DT_NEEDED contains libstdc++.so.6 or libgcc_s.so.1"
            exit 1
          fi
          echo "OK: DT_NEEDED has no libstdc++.so.6 / libgcc_s.so.1"
          readelf -d ./torrentfs-check | grep NEEDED
          rm -f ./torrentfs-check

      - name: Smoke test privilege drop
        run: |
          docker run --rm \
            -v "$PWD/ci/tests/entrypoint_smoke.sh:/smoke.sh:ro" \
            --entrypoint /bin/bash \
            torrentfs:ci /smoke.sh

      - name: Smoke test torrentfs user shell
        run: ./ci/tests/user_shell_smoke.sh torrentfs:ci

      - name: Setup Rust toolchain
        # TC-container-02 needs the self-seed tracker+seeder example on the
        # host to produce a real swarm for the host-side byte comparison.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/libtorrent-sys-cache
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-container-acceptance-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml', 'libtorrent-sys/src/defines.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Build the self-seed example
        run: cargo build --locked --release --example torrentfs-selfseed-env

      - name: Prepare a shared host directory for the container cases
        # rshared propagation only reaches the host when the bind source lives
        # on a shared mount; the runner's /tmp is not guaranteed to be shared.
        run: |
          sudo mkdir -p /srv/torrentfs-acceptance
          sudo chown "$(id -u):$(id -g)" /srv/torrentfs-acceptance
          sudo mount --bind /srv/torrentfs-acceptance /srv/torrentfs-acceptance
          sudo mount --make-shared /srv/torrentfs-acceptance

      - name: Run acceptance container cases
        # TC-container-01..08 exercise the production image and entrypoint:
        # rshared host visibility, state persistence across a restart,
        # argument passthrough and exit codes, same-host-directory conflict,
        # config-source precedence, SIGKILL residue recovery and non-TTY
        # diagnostic capture.  They run here where the image was just built
        # and a docker daemon is available.  Each script self-gates: an
        # environment that cannot provide the required capability (no
        # /dev/fuse, no CAP_SYS_ADMIN, no shared host directory) exits 2,
        # which the loop records as a SKIP warning and then continues with
        # the remaining cases; any other non-zero exit fails the job.
        run: |
          set -euo pipefail
          for tc in tc_container_01 tc_container_02 tc_container_03 tc_container_04 tc_container_05 tc_container_06 tc_container_07 tc_container_08; do
            rc=0
            ./tests/acceptance/$tc.sh torrentfs:ci /srv/torrentfs-acceptance || rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "::warning title=TC-container SKIP::$tc skipped — host runner cannot provide the required container/FUSE capability"
              continue
            fi
            [ "$rc" -eq 0 ] || exit "$rc"
          done

  docker-build-arm64:
    name: Docker Build (arm64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/arm64
          tags: torrentfs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify static C++ runtime linkage
        # arm64 is a published artifact and its runtime image no longer
        # installs libstdc++6 either: assert the same DT_NEEDED condition as
        # the amd64 job so an arm64-only regression cannot ship.
        run: |
          docker create --name torrentfs-check torrentfs:ci
          docker cp torrentfs-check:/usr/local/bin/torrentfs ./torrentfs-check
          docker rm torrentfs-check
          if readelf -d ./torrentfs-check | grep -E 'libstdc\+\+\.so\.6|libgcc_s\.so\.1'; then
            echo "::error title=Static runtime linkage regressed::DT_NEEDED contains libstdc++.so.6 or libgcc_s.so.1"
            exit 1
          fi
          echo "OK: DT_NEEDED has no libstdc++.so.6 / libgcc_s.so.1"
          readelf -d ./torrentfs-check | grep NEEDED
          rm -f ./torrentfs-check

  window-boundary-e2e:
    name: Window Boundary E2E (>4 GiB sparse seed)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:sid-slim
      # FUSE mount needs the device node and CAP_SYS_ADMIN; the runner VM's
      # /dev/fuse is passed through (same flags the Docker image documents).
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          apt-get update
          # libtorrent 2.1.1 and the Boost headers are fetched and compiled by
          # the crate's build script: the build chain needs a C++17 compiler and
          # openssl, nothing else.
          apt-get install -y --no-install-recommends \
            g++ \
            libssl-dev \
            fuse3 \
            curl \
            ca-certificates
          # torrentfs mounts with allow_other; fuse3 gates that on this line.
          touch /etc/fuse.conf
          grep -q '^user_allow_other$' /etc/fuse.conf || echo 'user_allow_other' >> /etc/fuse.conf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/libtorrent-sys-cache
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-window-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml', 'libtorrent-sys/src/defines.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Build torrentfs and the selfseed example
        run: |
          cargo build --locked --release
          cargo build --locked --release --example torrentfs-selfseed-env

      - name: Run window boundary e2e
        run: ./ci/tests/window_boundary_e2e.sh

  prefetch-ladder-e2e:
