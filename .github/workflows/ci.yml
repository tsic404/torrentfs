name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Cargo Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
      fail-fast: false
    container: debian:sid-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          apt-get update
          echo "deb http://deb.debian.org/debian experimental main" >> /etc/apt/sources.list
          apt-get update
          # libtorrent-rasterbar-dev is only packaged in experimental. Install it
          # in its own command so `-t experimental` does not also resolve clang,
          # libssl-dev and curl from experimental, whose clang/OpenSSL are
          # mid-transition and unsatisfiable alongside sid.
          apt-get install -y --no-install-recommends \
            -t experimental libtorrent-rasterbar-dev
          apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config \
            clang \
            libclang-dev \
            libfuse-dev \
            curl \
            ca-certificates

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Run tests
        id: run_tests
        # A libtorrent-backed test can abort the test process instead of
        # failing cleanly (known `piece_picker` lifetime flake class), so the
        # raw outcome is recorded here and classified by the next step: this
        # step on its own never fails the job.
        continue-on-error: true
        run: cargo test --locked --workspace --no-fail-fast

      - name: Classify test outcome
        if: steps.run_tests.outcome == 'failure'
        run: |
          # One retry. A suite that fails and then passes is flaky, not broken;
          # a suite that fails twice is a real failure. The two outcomes get
          # distinct annotations so a flake is never read as a regression.
          if cargo test --locked --workspace --no-fail-fast; then
            echo "::warning title=Flaky test (FLAKY)::Cargo Test (${{ matrix.arch }}) failed on the first attempt and passed on retry. Treat as FLAKY, not as a real failure."
            {
              echo "### FLAKY — not a real failure"
              echo
              echo 'The first `cargo test --locked --workspace --no-fail-fast` run failed and the retry passed.'
              echo 'This is the known libtorrent `piece_picker` lifetime flake class, not a regression from this PR.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Real test failure::Cargo Test (${{ matrix.arch }}) failed twice in a row. Treat as a REAL failure."
            exit 1
          fi

      - name: Run seeder example tests
        run: cargo test --locked --example torrentfs-selfseed-env --example torrentfs-mffs-seeder

  entrypoint-test:
    name: Entrypoint Shell Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run entrypoint detection tests
        run: ./ci/tests/entrypoint_test.sh

      - name: Syntax-check FUSE e2e script (not run here, no /dev/fuse)
        run: bash -n ./ci/tests/small_cache_read_e2e.sh

  deploy-rootful-test:
    name: Deploy Rootful Shell Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run deploy_rootful tests
        run: ./ci/tests/deploy_rootful_test.sh

  self-seed-env-test:
    name: Self-Seed Env Shell Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run self-seed env validation tests
        run: ./ci/tests/self_seed_env_test.sh

  docker-build-amd64:
    name: Docker Build (amd64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: torrentfs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: docker run --rm torrentfs:ci --help

      - name: Smoke test privilege drop
        run: |
          docker run --rm \
            -v "$PWD/ci/tests/entrypoint_smoke.sh:/smoke.sh:ro" \
            --entrypoint /bin/bash \
            torrentfs:ci /smoke.sh

      - name: Smoke test torrentfs user shell
        run: ./ci/tests/user_shell_smoke.sh torrentfs:ci

  docker-build-arm64:
    name: Docker Build (arm64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  window-boundary-e2e:
    name: Window Boundary E2E (>4 GiB sparse seed)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:sid-slim
      # FUSE mount needs the device node and CAP_SYS_ADMIN; the runner VM's
      # /dev/fuse is passed through (same flags the Docker image documents).
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          apt-get update
          echo "deb http://deb.debian.org/debian experimental main" >> /etc/apt/sources.list
          apt-get update
          # libtorrent-rasterbar-dev is only packaged in experimental (see the
          # test job above for why it is installed separately from the rest).
          apt-get install -y --no-install-recommends \
            -t experimental libtorrent-rasterbar-dev
          apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config \
            clang \
            libclang-dev \
            libfuse-dev \
            fuse3 \
            curl \
            ca-certificates
          # torrentfs mounts with allow_other; fuse3 gates that on this line.
          touch /etc/fuse.conf
          grep -q '^user_allow_other$' /etc/fuse.conf || echo 'user_allow_other' >> /etc/fuse.conf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-window-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Build torrentfs and the selfseed example
        run: |
          cargo build --locked --release
          cargo build --locked --release --example torrentfs-selfseed-env

      - name: Run window boundary e2e
        run: ./ci/tests/window_boundary_e2e.sh

  prefetch-ladder-e2e:
    name: Prefetch Ladder E2E (>=512 MiB seed)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:sid-slim
      # FUSE mount needs the device node and CAP_SYS_ADMIN; the runner VM's
      # /dev/fuse is passed through (same flags the Docker image documents).
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          apt-get update
          echo "deb http://deb.debian.org/debian experimental main" >> /etc/apt/sources.list
          apt-get update
          # libtorrent-rasterbar-dev is only packaged in experimental (see the
          # test job above for why it is installed separately from the rest).
          apt-get install -y --no-install-recommends \
            -t experimental libtorrent-rasterbar-dev
          apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config \
            clang \
            libclang-dev \
            libfuse-dev \
            fuse3 \
            curl \
            ca-certificates
          # torrentfs mounts with allow_other; fuse3 gates that on this line.
          touch /etc/fuse.conf
          grep -q '^user_allow_other$' /etc/fuse.conf || echo 'user_allow_other' >> /etc/fuse.conf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-prefetch-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Build torrentfs and the selfseed example
        run: |
          cargo build --locked --release
          cargo build --locked --release --example torrentfs-selfseed-env

      - name: Run prefetch ladder e2e
        run: ./ci/tests/prefetch_ladder_e2e.sh

  multifile-read-e2e:
    name: Multi-File Read E2E (seeded multi-file torrent)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:sid-slim
      # FUSE mount needs the device node and CAP_SYS_ADMIN; the runner VM's
      # /dev/fuse is passed through (same flags the Docker image documents).
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          apt-get update
          echo "deb http://deb.debian.org/debian experimental main" >> /etc/apt/sources.list
          apt-get update
          # libtorrent-rasterbar-dev is only packaged in experimental (see the
          # test job above for why it is installed separately from the rest).
          apt-get install -y --no-install-recommends \
            -t experimental libtorrent-rasterbar-dev
          apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config \
            clang \
            libclang-dev \
            libfuse-dev \
            fuse3 \
            curl \
            ca-certificates
          # torrentfs mounts with allow_other; fuse3 gates that on this line.
          touch /etc/fuse.conf
          grep -q '^user_allow_other$' /etc/fuse.conf || echo 'user_allow_other' >> /etc/fuse.conf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-multifile-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Build torrentfs and the selfseed example
        run: |
          cargo build --locked --release
          cargo build --locked --release --example torrentfs-selfseed-env

      - name: Run multi-file read e2e
        run: ./ci/tests/multifile_read_e2e.sh

  session-recovery-e2e:
    name: Session Recovery E2E (severed FUSE connection)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:sid-slim
      # FUSE mount needs the device node and CAP_SYS_ADMIN; the runner VM's
      # /dev/fuse is passed through (same flags the Docker image documents).
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          apt-get update
          echo "deb http://deb.debian.org/debian experimental main" >> /etc/apt/sources.list
          apt-get update
          # libtorrent-rasterbar-dev is only packaged in experimental (see the
          # test job above for why it is installed separately from the rest).
          apt-get install -y --no-install-recommends \
            -t experimental libtorrent-rasterbar-dev
          apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config \
            clang \
            libclang-dev \
            libfuse-dev \
            fuse3 \
            curl \
            ca-certificates
          # torrentfs mounts with allow_other; fuse3 gates that on this line.
          touch /etc/fuse.conf
          grep -q '^user_allow_other$' /etc/fuse.conf || echo 'user_allow_other' >> /etc/fuse.conf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-session-recovery-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Build torrentfs and the selfseed example
        run: |
          cargo build --locked --release
          cargo build --locked --release --example torrentfs-selfseed-env

      - name: Create the daemon user
        # The entrypoint drops torrentfs to TORRENTFS_UID (1000) and fusermount3
        # resolves that uid through NSS; debian:sid-slim has no uid-1000 user,
        # so the mount fails with "could not determine username".  The image
        # creates the same user in its own Dockerfile.
        run: |
          groupadd --gid 1000 torrentfs
          useradd --uid 1000 --gid 1000 --home-dir /home/torrentfs --create-home --shell /bin/sh torrentfs

      - name: Run session recovery e2e
        run: ./ci/tests/session_recovery_e2e.sh
