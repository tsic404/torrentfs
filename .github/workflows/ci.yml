  session-recovery-e2e:
    name: Session Recovery E2E (severed FUSE connection)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:sid-slim
      # FUSE mount needs the device node and CAP_SYS_ADMIN; the runner VM's
      # /dev/fuse is passed through (same flags the Docker image documents).
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          apt-get update
          # libtorrent 2.1.1 and the Boost headers are fetched and compiled by
          # the crate's build script: the build chain needs a C++17 compiler,
          # openssl and libfuse development files, nothing else.
          apt-get install -y --no-install-recommends \
            g++ \
            libssl-dev \
            libfuse-dev \
            fuse3 \
            curl \
            ca-certificates
          # torrentfs mounts with allow_other; fuse3 gates that on this line.
          touch /etc/fuse.conf
          grep -q '^user_allow_other$' /etc/fuse.conf || echo 'user_allow_other' >> /etc/fuse.conf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/libtorrent-sys-cache
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-session-recovery-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml', 'libtorrent-sys/src/defines.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Build torrentfs and the selfseed example
        run: |
          cargo build --locked --release
          cargo build --locked --release --example torrentfs-selfseed-env

      - name: Create the daemon user
        # The entrypoint drops torrentfs to TORRENTFS_UID (1000) and fusermount3
        # resolves that uid through NSS; debian:sid-slim has no uid-1000 user,
        # so the mount fails with "could not determine username".  The image
        # creates the same user in its own Dockerfile.
        run: |
          groupadd --gid 1000 torrentfs
          useradd --uid 1000 --gid 1000 --home-dir /home/torrentfs --create-home --shell /bin/sh torrentfs

      - name: Run session recovery e2e
        run: ./ci/tests/session_recovery_e2e.sh

  bindings-drift:
    name: Bindings Drift (regenerate + diff)
    runs-on: ubuntu-24.04
    # Debian 12 keeps clang 14 for the life of the release, unlike the rolling
    # `sid` the other jobs use: libclang is part of the generator whose output is
    # committed, and a libclang upgrade would otherwise turn this job red with the
    # declarations unchanged (design §4 #7).
    container: debian:bookworm-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          apt-get update
          # The build chain itself needs no bindgen and no libclang (the
          # declarations are pre-generated); regenerating them does, which is
          # why this runs as its own job (design §4 #7). gcc links the pinned
          # bindgen CLI that regenerate-bindings.sh installs.
          apt-get install -y --no-install-recommends \
            gcc \
            libclang-14-dev \
            curl \
            ca-certificates

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-bindgen-cli-${{ hashFiles('libtorrent-sys/regenerate-bindings.sh') }}

      - name: Keep the committed declarations aside
        # A container job checks the repository out as a plain archive, so there
        # is no working tree to diff against: keep the committed bytes and
        # compare the regenerated file with them.
        run: cp libtorrent-sys/src/bindings.rs /tmp/bindings.committed.rs

      - name: Regenerate the committed declarations
        env:
          # Naming the pinned libclang keeps the generator fixed instead of
          # resolved from whatever the image ships by default.
          LIBCLANG_PATH: /usr/lib/llvm-14/lib
        run: ./libtorrent-sys/regenerate-bindings.sh

      - name: Fail on any drift from the committed declarations
        run: |
          if ! diff -u /tmp/bindings.committed.rs libtorrent-sys/src/bindings.rs; then
            echo "::error::libtorrent-sys/src/bindings.rs is stale; regenerate it with libtorrent-sys/regenerate-bindings.sh"
            exit 1
          fi
