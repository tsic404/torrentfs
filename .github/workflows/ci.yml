name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow only reads the repository: every job checks out and builds.
# Declaring it explicitly keeps the default token scope from growing with the
# repository settings.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Cargo Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
      fail-fast: false
    container: debian:sid-slim
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install system dependencies
        run: |
          apt-get update
          # libtorrent 2.1.1 and the Boost headers are fetched and compiled by
          # the crate's build script: the build chain needs a C++17 compiler and
          # openssl, nothing else.
          apt-get install -y --no-install-recommends \
            g++ \
            libssl-dev \
            curl \
            ca-certificates

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          # A concrete release, not `stable`: the image pins the same version,
          # so a toolchain bump is a reviewed change instead of drift.
          toolchain: 1.99.1

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/libtorrent-sys-cache
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml', 'libtorrent-sys/src/defines.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Run tests
        id: run_tests
        # The raw outcome is recorded (and the log kept for classification) so
        # the next step can tell an allowlisted flake from a real failure; this
        # step on its own never fails the job.  `pipefail` keeps cargo's status
        # in front of the tee.
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --locked --workspace --no-fail-fast 2>&1 | tee cargo-test.log

      - name: Classify test outcome
        if: steps.run_tests.outcome == 'failure'
        run: |
          set -uo pipefail
          # Only the known libtorrent `piece_picker` lifetime flake class is
          # retried, and only when it is what failed: a retry that happens to
          # pass would otherwise hide every new race in the suite.  The target
          # is listed as well so a process abort — which reports no test name —
          # is still attributable.
          flaky_target="tests/piece_registration_test.rs"
          flaky_tests=(
            test_read_registers_prefetched_pieces
            test_background_prefetch_registers_via_piece_finished_alert
            test_truncated_piece_reheals_via_recheck_and_redownload
          )

          # Which test binaries did not report a passing run (a failed or
          # aborted binary never prints `test result: ok`), and which tests
          # failed.
          failed_targets="$(awk '
            /^ *Running / {
              if (target != "" && !ok) print target
              target = $2; ok = 0; next
            }
            /^test result: ok/ { ok = 1 }
            END { if (target != "" && !ok) print target }
          ' cargo-test.log | sort -u)"
          failed_tests="$(awk '
            /^failures:$/ { infail = 1; next }
            /^test result:/ { infail = 0 }
            infail && /^    [^- ]/ { print $1 }
          ' cargo-test.log | sort -u)"

          unexpected=""
          while IFS= read -r target; do
            [ -z "$target" ] && continue
            [ "$target" = "$flaky_target" ] || unexpected="$unexpected $target"
          done <<< "$failed_targets"
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            printf '%s\n' "${flaky_tests[@]}" | grep -qxF "$name" || unexpected="$unexpected $name"
          done <<< "$failed_tests"

          if [ -n "$unexpected" ]; then
            echo "::error title=Real test failure::Cargo Test (${{ matrix.arch }}) failed outside the flaky allowlist:$unexpected"
            exit 1
          fi
          if [ -z "$failed_targets" ] && [ -z "$failed_tests" ]; then
            echo "::error title=Test failure unreadable::the suite failed but neither a test binary nor a test name could be extracted from cargo-test.log"
            exit 1
          fi

          # Retry the allowlisted tests only; the rest of the suite already
          # passed in the first run.  `failed_tests` is a newline-separated
          # string: expanding "${failed_tests[@]}" on it yields ONE element that
          # still contains the newlines, which libtest treats as a filter
          # matching nothing — the retry would "pass" with 0 tests run.  Split
          # it into an array so each name is its own filter argument.
          if [ -n "$failed_tests" ]; then
            mapfile -t retry_names <<< "$failed_tests"
            retry=(-- "${retry_names[@]}")
          else
            retry=(--test piece_registration_test)
          fi
          # `cargo test` exits 0 when the filter matches no test, so the exit
          # status alone cannot prove the flake was re-run.  Require a non-empty
          # `test result: ok. N passed` line; an empty retry is a real failure.
          cargo test --locked --workspace --no-fail-fast "${retry[@]}" 2>&1 | tee cargo-test-retry.log
          retry_rc="${PIPESTATUS[0]}"
          retry_ran=0
          if grep -Eq '^test result: ok\. [1-9][0-9]* passed' cargo-test-retry.log; then
            retry_ran=1
          fi
          if [ "$retry_rc" -eq 0 ] && [ "$retry_ran" -eq 1 ]; then
            echo "::warning title=Flaky test (FLAKY)::Cargo Test (${{ matrix.arch }}) failed only in the allowlisted piece_picker flake class and passed on retry. Treat as FLAKY, not as a real failure."
            {
              echo "### FLAKY — not a real failure"
              echo
              echo 'The first run failed only in the allowlisted libtorrent `piece_picker` lifetime flake class.'
              echo 'The retry passed; no test outside the allowlist failed.'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$retry_rc" -eq 0 ]; then
            echo "::error title=Real test failure::Cargo Test (${{ matrix.arch }}) retried the allowlisted flakes but ran no test (filter matched nothing) — treating as a REAL failure."
            exit 1
          else
            echo "::error title=Real test failure::Cargo Test (${{ matrix.arch }}) failed twice in a row, including the allowlisted flake retry. Treat as a REAL failure."
            exit 1
          fi

      - name: Run seeder example tests
        run: cargo test --locked --example torrentfs-selfseed-env --example torrentfs-mffs-seeder

  entrypoint-test:
