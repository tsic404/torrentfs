  acceptance-fuse-e2e:
    name: Acceptance FUSE E2E (tests/acceptance P0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:sid-slim
      # FUSE mount needs the device node and CAP_SYS_ADMIN; the runner VM's
      # /dev/fuse is passed through (same flags the Docker image documents).
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install system dependencies
        run: |
          apt-get update
          # libtorrent 2.1.1 and the Boost headers are fetched and compiled by
          # the crate's build script: the build chain needs a C++17 compiler and
          # openssl, nothing else.
          apt-get install -y --no-install-recommends \
            g++ \
            libssl-dev \
            fuse3 \
            curl \
            ca-certificates
          # torrentfs mounts with allow_other; fuse3 gates that on this line.
          touch /etc/fuse.conf
          grep -q '^user_allow_other$' /etc/fuse.conf || echo 'user_allow_other' >> /etc/fuse.conf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          # A concrete release, not `stable`: the image pins the same version,
          # so a toolchain bump is a reviewed change instead of drift.
          toolchain: 1.99.1

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/libtorrent-sys-cache
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-acceptance-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml', 'libtorrent-sys/src/defines.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Build torrentfs
        run: cargo build --locked --release

      - name: Create the daemon user
        # tc_recovery_05 drives the rootful entrypoint, which drops torrentfs
        # to TORRENTFS_UID (1000); fusermount3 resolves that uid through NSS,
        # and debian:sid-slim has no uid-1000 user, so the mount would fail
        # with "could not determine username".
        run: |
          groupadd --gid 1000 torrentfs
          useradd --uid 1000 --gid 1000 --home-dir /home/torrentfs --create-home --shell /bin/sh torrentfs

      - name: Run acceptance FUSE cases
        # Case exit codes: 0 = PASS, 1 = FAIL, 2 = SKIP (the case self-gated:
        # no /dev/fuse or no fusermount3).  A job where every case skipped
        # asserted nothing and fails too.  This job installs fuse3 and runs
        # as root with /dev/fuse, so the passing path is real.
        run: |
          set -euo pipefail
          # The first ten are the long-standing carriers; the last four are a
          # smoke subset of the added ones covering the four fixtures (torrent
          # builder, tracker/peer swarm, stats rendering, by-name/read paths),
          # so a fixture regression fails here instead of surfacing only in
          # acceptance execution.
          ran=0
          for tc in tc_ingest_01 tc_ingest_03 tc_ingest_06 tc_rofs_01 tc_read_04 tc_stats_01 tc_stats_02 tc_recovery_01 tc_cache_02 tc_recovery_05 \
                    tc_read_01 tc_ingest_02 tc_stats_06 tc_seeding_02; do
            rc=0
            ./tests/acceptance/$tc.sh ./target/release/torrentfs "/tmp/torrentfs_acceptance_$tc" || rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "::warning::$tc SKIP (no /dev/fuse or fusermount3 on this runner)"
            elif [ "$rc" -ne 0 ]; then
              echo "::error::$tc FAIL (rc=$rc)"
              exit "$rc"
            else
              ran=$((ran + 1))
            fi
          done
          if [ "$ran" -eq 0 ]; then
            echo "::error title=No acceptance case ran::every acceptance case skipped — the job asserted nothing"
            exit 1
          fi
          echo "Acceptance cases executed: $ran"

      # TC-negative-03's mount-dependent half (forbidden state paths inside
      # the mountpoint and the remount comparison) needs a live FUSE mount.
      # The regular Cargo Test jobs have no /dev/fuse; this job does, so the
      # carrier's full scenario runs here.
      - name: Run negative acceptance carrier (FUSE-dependent half)
        run: cargo test --locked --release --test acceptance -- tc_negative_03 --nocapture

      - name: Run acceptance recovery cases (FUSE)
        # The Rust carriers skip themselves without /dev/fuse, so the plain
        # `cargo test` job (no device) never executes them; this is the job
        # that has the device and the capability to mount.
        run: cargo test --locked --release --test acceptance -- tc_recovery_0

  bindings-drift:
    name: Bindings Drift (regenerate + diff)
    runs-on: ubuntu-24.04
    # Debian 12 keeps clang 14 for the life of the release, unlike the rolling
    # `sid` the other jobs use: libclang is part of the generator whose output is
    # committed, and a libclang upgrade would otherwise turn this job red with the
    # declarations unchanged (design §4 #7).
    container: debian:bookworm-slim
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install system dependencies
        run: |
          apt-get update
          # The build chain itself needs no bindgen and no libclang (the
          # declarations are pre-generated); regenerating them does, which is
          # why this runs as its own job (design §4 #7). gcc links the pinned
          # bindgen CLI that regenerate-bindings.sh installs.
          apt-get install -y --no-install-recommends \
            gcc \
            libclang-14-dev \
            curl \
            ca-certificates

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          # A concrete release, not `stable`: the image pins the same version,
          # so a toolchain bump is a reviewed change instead of drift.
          toolchain: 1.99.1

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-bindgen-cli-${{ hashFiles('libtorrent-sys/regenerate-bindings.sh') }}

      - name: Keep the committed declarations aside
        # A container job checks the repository out as a plain archive, so there
        # is no working tree to diff against: keep the committed bytes and
        # compare the regenerated file with them.
        run: cp libtorrent-sys/src/bindings.rs /tmp/bindings.committed.rs

      - name: Regenerate the committed declarations
        env:
          # Naming the pinned libclang keeps the generator fixed instead of
          # resolved from whatever the image ships by default.
          LIBCLANG_PATH: /usr/lib/llvm-14/lib
        run: ./libtorrent-sys/regenerate-bindings.sh

      - name: Fail on any drift from the committed declarations
        run: |
          if ! diff -u /tmp/bindings.committed.rs libtorrent-sys/src/bindings.rs; then
            echo "::error::libtorrent-sys/src/bindings.rs is stale; regenerate it with libtorrent-sys/regenerate-bindings.sh"
            exit 1
          fi
