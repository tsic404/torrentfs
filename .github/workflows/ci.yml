name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Cargo Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
      fail-fast: false
    container: debian:sid-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          apt-get update
          echo "deb http://deb.debian.org/debian experimental main" >> /etc/apt/sources.list
          apt-get update
          # libtorrent-rasterbar-dev is only packaged in experimental. Install it
          # in its own command so `-t experimental` does not also resolve clang,
          # libssl-dev and curl from experimental, whose clang/OpenSSL are
          # mid-transition and unsatisfiable alongside sid.
          apt-get install -y --no-install-recommends \
            -t experimental libtorrent-rasterbar-dev
          apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config \
            clang \
            libclang-dev \
            libfuse-dev \
            curl \
            ca-certificates

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Run tests
        run: cargo test --locked --workspace --no-fail-fast

      - name: Run seeder example tests
        run: cargo test --locked --example torrentfs-selfseed-env --example torrentfs-mffs-seeder

  entrypoint-test:
    name: Entrypoint Shell Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run entrypoint detection tests
        run: ./ci/tests/entrypoint_test.sh

      - name: Syntax-check FUSE e2e script (not run here, no /dev/fuse)
        run: bash -n ./ci/tests/small_cache_read_e2e.sh

  deploy-rootful-test:
    name: Deploy Rootful Shell Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run deploy_rootful tests
        run: ./ci/tests/deploy_rootful_test.sh

  self-seed-env-test:
    name: Self-Seed Env Shell Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run self-seed env validation tests
        run: ./ci/tests/self_seed_env_test.sh

  docker-build-amd64:
    name: Docker Build (amd64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: torrentfs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: docker run --rm torrentfs:ci --help

      - name: Smoke test privilege drop
        run: |
          docker run --rm \
            -v "$PWD/ci/tests/entrypoint_smoke.sh:/smoke.sh:ro" \
            --entrypoint /bin/bash \
            torrentfs:ci /smoke.sh

      - name: Smoke test torrentfs user shell
        run: ./ci/tests/user_shell_smoke.sh torrentfs:ci

  docker-build-arm64:
    name: Docker Build (arm64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  window-boundary-e2e:
    name: Window Boundary E2E (>4 GiB sparse seed)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:sid-slim
      # FUSE mount needs the device node and CAP_SYS_ADMIN; the runner VM's
      # /dev/fuse is passed through (same flags the Docker image documents).
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          apt-get update
          echo "deb http://deb.debian.org/debian experimental main" >> /etc/apt/sources.list
          apt-get update
          # libtorrent-rasterbar-dev is only packaged in experimental (see the
          # test job above for why it is installed separately from the rest).
          apt-get install -y --no-install-recommends \
            -t experimental libtorrent-rasterbar-dev
          apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config \
            clang \
            libclang-dev \
            libfuse-dev \
            fuse3 \
            curl \
            ca-certificates
          # torrentfs mounts with allow_other; fuse3 gates that on this line.
          touch /etc/fuse.conf
          grep -q '^user_allow_other$' /etc/fuse.conf || echo 'user_allow_other' >> /etc/fuse.conf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-window-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Build torrentfs and the selfseed example
        run: |
          cargo build --locked --release
          cargo build --locked --release --example torrentfs-selfseed-env

      - name: Run window boundary e2e
        run: ./ci/tests/window_boundary_e2e.sh

  prefetch-ladder-e2e:
    name: Prefetch Ladder E2E (>=512 MiB seed)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:sid-slim
      # FUSE mount needs the device node and CAP_SYS_ADMIN; the runner VM's
      # /dev/fuse is passed through (same flags the Docker image documents).
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          apt-get update
          echo "deb http://deb.debian.org/debian experimental main" >> /etc/apt/sources.list
          apt-get update
          # libtorrent-rasterbar-dev is only packaged in experimental (see the
          # test job above for why it is installed separately from the rest).
          apt-get install -y --no-install-recommends \
            -t experimental libtorrent-rasterbar-dev
          apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config \
            clang \
            libclang-dev \
            libfuse-dev \
            fuse3 \
            curl \
            ca-certificates
          # torrentfs mounts with allow_other; fuse3 gates that on this line.
          touch /etc/fuse.conf
          grep -q '^user_allow_other$' /etc/fuse.conf || echo 'user_allow_other' >> /etc/fuse.conf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-sid21-prefetch-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sid21-cargo-

      - name: Build torrentfs and the selfseed example
        run: |
          cargo build --locked --release
          cargo build --locked --release --example torrentfs-selfseed-env

      - name: Run prefetch ladder e2e
        run: ./ci/tests/prefetch_ladder_e2e.sh
