name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci-gate:
    name: Require green CI for this commit
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the CI workflow result on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A publish must never outrun the tests: the build jobs below wait for
          # ci.yml to report success for this exact commit. A run that is not
          # visible yet gets a short grace window (the push-triggered run can
          # take a few seconds to appear); a commit with no run at all is not
          # published, and a wait that exceeds the deadline is a failure rather
          # than a silent push of untested bytes.
          start="$(date +%s)"
          grace_deadline=$((start + 120))
          wait_deadline=$((start + 3600))
          while :; do
            if ! runs="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100")"; then
              echo "::error title=CI query failed::could not read the ci.yml runs for $SHA"
              exit 1
            fi
            status=""
            conclusion=""
            read -r status conclusion < <(jq -r --arg sha "$SHA" '
              ([.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_started_at) | last) as $run
              | [($run.status // ""), ($run.conclusion // "")] | @tsv' <<<"$runs") || true
            if [ "$conclusion" = "success" ]; then
              echo "CI is green for $SHA"
              exit 0
            fi
            if [ -n "$conclusion" ]; then
              echo "::error title=CI not green::ci.yml concluded '$conclusion' for $SHA — refusing to publish"
              exit 1
            fi
            now="$(date +%s)"
            if [ -z "$status" ]; then
              if [ "$now" -ge "$grace_deadline" ]; then
                echo "::error title=No CI run::no ci.yml run found for $SHA — refusing to publish an untested commit"
                exit 1
              fi
            elif [ "$now" -ge "$wait_deadline" ]; then
              echo "::error title=CI timeout::ci.yml for $SHA was still '$status' after 60 minutes"
              exit 1
            fi
            sleep 15
          done

  build-and-push-amd64:
    name: Build and Push (amd64)
    runs-on: ubuntu-24.04
    needs: [ci-gate]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-amd64,onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify static C++ runtime linkage
        # Published artifact: assert the binary's DT_NEEDED carries no
        # libstdc++ / libgcc_s — ADR-002's dynamic-dependency invariant.  The
        # base image keeps its own libstdc++6 / libgcc_s.so.1, so this guards
        # the contract rather than runtime viability.
        run: |
          image="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker create --name torrentfs-check "$image"
          docker cp torrentfs-check:/usr/local/bin/torrentfs ./torrentfs-check
          docker rm torrentfs-check
          if readelf -d ./torrentfs-check | grep -E 'libstdc\+\+\.so\.6|libgcc_s\.so\.1'; then
            echo "::error title=Static runtime linkage regressed::DT_NEEDED contains libstdc++.so.6 or libgcc_s.so.1"
            exit 1
          fi
          echo "OK: DT_NEEDED has no libstdc++.so.6 / libgcc_s.so.1"
          readelf -d ./torrentfs-check | grep NEEDED
          rm -f ./torrentfs-check

  build-and-push-arm64:
    name: Build and Push (arm64)
    runs-on: ubuntu-24.04-arm
    needs: [ci-gate]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-arm64,onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          load: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify static C++ runtime linkage
        # Published artifact: assert the binary's DT_NEEDED carries no
        # libstdc++ / libgcc_s — ADR-002's dynamic-dependency invariant.  The
        # base image keeps its own libstdc++6 / libgcc_s.so.1, so this guards
        # the contract rather than runtime viability.
        run: |
          image="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker create --name torrentfs-check "$image"
          docker cp torrentfs-check:/usr/local/bin/torrentfs ./torrentfs-check
          docker rm torrentfs-check
          if readelf -d ./torrentfs-check | grep -E 'libstdc\+\+\.so\.6|libgcc_s\.so\.1'; then
            echo "::error title=Static runtime linkage regressed::DT_NEEDED contains libstdc++.so.6 or libgcc_s.so.1"
            exit 1
          fi
          echo "OK: DT_NEEDED has no libstdc++.so.6 / libgcc_s.so.1"
          readelf -d ./torrentfs-check | grep NEEDED
          rm -f ./torrentfs-check

  merge-manifest:
    name: Merge Multi-Arch Manifest
    runs-on: ubuntu-24.04
    needs: [build-and-push-amd64, build-and-push-arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create multi-arch manifests
        run: |
          while IFS= read -r tag; do
            echo "Merging: $tag <- ${tag}-amd64 + ${tag}-arm64"
            docker buildx imagetools create -t "$tag" \
              --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
              "${tag}-amd64" "${tag}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"

      # Regression guard: index and both arch children must carry this event's sha, else the publish went stale.
      - name: Assert manifest revision matches event sha
        run: |
          failed=0
          while IFS= read -r tag; do
            echo "=== $tag (expect revision $GITHUB_SHA) ==="
            info="$(docker buildx imagetools inspect "$tag" --format '{{json .}}')"
            for platform in linux/amd64 linux/arm64; do
              rev="$(jq -r --arg p "$platform" '.image[$p].config.Labels["org.opencontainers.image.revision"] // empty' <<<"$info")"
              echo "  $platform revision=$rev"
              if [ "$rev" != "$GITHUB_SHA" ]; then
                echo "::error::$tag $platform revision '${rev:-missing}' != event sha $GITHUB_SHA"
                failed=1
              fi
            done
            index_rev="$(docker buildx imagetools inspect "$tag" --raw | jq -r '.annotations["org.opencontainers.image.revision"] // empty')"
            echo "  index annotation revision=$index_rev"
            if [ "$index_rev" != "$GITHUB_SHA" ]; then
              echo "::error::$tag index annotation revision '${index_rev:-missing}' != event sha $GITHUB_SHA"
              failed=1
            fi
          done <<< "${{ steps.meta.outputs.tags }}"
          exit "$failed"
