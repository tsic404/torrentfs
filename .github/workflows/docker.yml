name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-amd64:
    name: Build and Push (amd64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-amd64,onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-arm64:
    name: Build and Push (arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-arm64,onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  merge-manifest:
    name: Merge Multi-Arch Manifest
    runs-on: ubuntu-24.04
    needs: [build-and-push-amd64, build-and-push-arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create multi-arch manifests
        run: |
          while IFS= read -r tag; do
            echo "Merging: $tag <- ${tag}-amd64 + ${tag}-arm64"
            docker buildx imagetools create -t "$tag" \
              --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
              "${tag}-amd64" "${tag}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"

      # Regression guard: index and both arch children must carry this event's sha, else the publish went stale.
      - name: Assert manifest revision matches event sha
        run: |
          failed=0
          while IFS= read -r tag; do
            echo "=== $tag (expect revision $GITHUB_SHA) ==="
            info="$(docker buildx imagetools inspect "$tag" --format '{{json .}}')"
            for platform in linux/amd64 linux/arm64; do
              rev="$(jq -r --arg p "$platform" '.image[$p].config.Labels["org.opencontainers.image.revision"] // empty' <<<"$info")"
              echo "  $platform revision=$rev"
              if [ "$rev" != "$GITHUB_SHA" ]; then
                echo "::error::$tag $platform revision '${rev:-missing}' != event sha $GITHUB_SHA"
                failed=1
              fi
            done
            index_rev="$(docker buildx imagetools inspect "$tag" --raw | jq -r '.annotations["org.opencontainers.image.revision"] // empty')"
            echo "  index annotation revision=$index_rev"
            if [ "$index_rev" != "$GITHUB_SHA" ]; then
              echo "::error::$tag index annotation revision '${index_rev:-missing}' != event sha $GITHUB_SHA"
              failed=1
            fi
          done <<< "${{ steps.meta.outputs.tags }}"
          exit "$failed"
